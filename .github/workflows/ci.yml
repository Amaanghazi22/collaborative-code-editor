name: CI

on:
  push:
    branches: [main, initial-work]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: collab_editor_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test_secret_for_ci_only
          JWT_EXPIRE: 7d
          FRONTEND_URL: http://localhost:5173

  frontend:
    name: Frontend — Type-check, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_COLLAB_CODE_BACKEND_URL: http://localhost:5001/
          VITE_COLLAB_CODE_SOCKET_URL: http://localhost:5001/
