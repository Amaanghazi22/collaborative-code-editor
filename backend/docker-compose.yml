services:
  postgres:
    image: postgres:15-alpine
    container_name: collab_editor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vR85pTq2Z
      POSTGRES_DB: collab_editor
    ports:
      - "5432:5432"
