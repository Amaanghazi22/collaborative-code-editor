################################################################################
# Judge0 Configuration — Production (Render)
################################################################################

RAILS_ENV=production
RACK_ENV=production

# Redis — Render provides Redis via internal URL
# Leave blank to use default localhost Redis (Render injects REDIS_URL)
REDIS_HOST=
REDIS_PORT=
# REDIS_PASSWORD= (commented out = no auth, matches Render's default Redis)

# PostgreSQL — Render provides DB via DATABASE_URL env var
# Judge0 reads POSTGRES_* vars; Render injects these automatically
POSTGRES_HOST=
POSTGRES_PORT=
POSTGRES_DB=
POSTGRES_USER=
POSTGRES_PASSWORD=

# Submission limits (reasonable defaults for a demo app)
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024

# Allow all origins (frontend is on a different domain)
ALLOW_ORIGIN=*
